experiment:
  name: qa_transfer
  output_root: runs
  local_root: .work
  env_files:
  - .env
  expected_feedback_tasks: 150
  expected_selection_tasks: 150
  expected_heldout_tasks: 250
  report_on_budget_stop: true
  max_infra_resumes: 0
schema_version: 1
seed: seeds/agents/qa_transfer/v0001
plugin_library: seeds/plugin_library_qa
search:
  local_failure_tasks: 10
  recomposition_offspring: 1
  iterations: 10
  offspring_per_phase: 8
  feedback_batch_size: 20
  random_seed: 42
  max_task_rollouts: 24000
  local_branch_timeout_seconds: 9000
evaluation:
  benchmark: qa_transfer
  feedback_tasks: datasets/qa_transfer_v1/heldin.jsonl
  selection_tasks: datasets/qa_transfer_v1/heldin.jsonl
  heldout_tasks: datasets/qa_transfer_v1/heldout.jsonl
  concurrency: 128
  parallel_heldout: true
  min_valid_ratio: 0.95
  infra_retry_attempts: 2
  task_timeout_seconds: 600
  infrastructure_timeout_seconds: 300
  startup_stagger_min_seconds: 15.0
  startup_stagger_max_seconds: 60.0
  benchmark_options:
    data_file: datasets/qa_transfer_v1/data.jsonl
    judge_config: datasets/qa_transfer_v1/judge.yaml
    math_timeout_seconds: 20
    math_startup_timeout_seconds: 120
    worker_python: ''
  accept_partial_results: false
  local_timeout_seconds: 7200
  evaluation_timeout_seconds: 3600
  verifier_timeout_seconds: 1800
  eager_infra_retries: true
  fail_fast_candidate_errors: true
  worker_initialization_timeout_seconds: 600
  full_min_valid_ratio: 0.9666666666666667
solver:
  model: ''
  api_mode: chat_completions
  api_key_env: SOLVER_API_KEY
  base_url_env: SOLVER_BASE_URL
  reasoning_effort: none
  max_output_tokens: 8192
  max_calls: 20
  timeout_seconds: 180.0
  max_attempts: 4
  retry_delay_seconds: 3.0
  rpm_limit: 300
  rpm_state_path: .rate_limits/qa_transfer.json
  adaptive_rate_limit: false
proposer:
  command:
  - python3
  - -m
  - pluginrsi.search.json_proposer
  concurrency: 20
  timeout_seconds: 900
  agent:
    model: ''
    api_mode: chat_completions
    api_key_env: EVOLVER_API_KEY
    base_url_env: EVOLVER_BASE_URL
    reasoning_effort: xhigh
    max_output_tokens: 16384
    max_calls: 40
    timeout_seconds: 360.0
    max_attempts: 4
    retry_delay_seconds: 3.0
    rpm_limit: 300
    rpm_state_path: .rate_limits/qa_transfer.json
    adaptive_rate_limit: false
  validation_timeout_seconds: 180.0
  validation_max_attempts: 2
  compact_evidence: true
  read_max_chars: 12000
  read_batch_max_chars: 32000
  context_max_bytes: 196608
  evidence_top_k: 3
