[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pluginrsi"
version = "0.1.0"
description = "PluginRSI: recursive improvement of agent harnesses with reusable plugins"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pydantic==2.12.3", "PyYAML==6.0.3", "jsonschema==4.26.0", "openai==2.54.0", "python-dotenv==1.2.2"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
harbor = ["harbor==0.18.0"]
data = ["huggingface-hub>=0.34,<2", "datasets>=3,<5", "pyarrow>=18"]
qa = ["sympy==1.13.1", "antlr4-python3-runtime==4.11.1"]

[project.scripts]
pluginrsi = "pluginrsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pluginrsi = ["prompts/*.md", "evaluation/third_party/OlympiadBench/LICENSE", "evaluation/third_party/OlympiadBench/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
