schema_version: 1
kind: tool
name: prior_read_range
version: v0001
entrypoint: implementation:PriorTool
description: Read a bounded line range with line numbers.
config_schema:
  type: object
  additionalProperties: false
  properties:
    repository_root:
      type: string
      default: .
    timeout_seconds:
      type: integer
      minimum: 1
      default: 180
    max_output_bytes:
      type: integer
      minimum: 1
      default: 32768
    max_file_bytes:
      type: integer
      minimum: 1
      default: 1048576
    max_lines:
      type: integer
      minimum: 1
      default: 500
provenance:
  label: T04 read_range (Aider / Agentless)
  sources:
  - id: aider
    title: Aider
    url: https://github.com/Aider-AI/aider
  - id: agentless
    title: Agentless
    url: https://github.com/OpenAutoCoder/Agentless
  upstream_assets:
  - id: T04
    path: tools/tool_registry.yaml
  adaptation: Normalized/synthesized upstream design guidance adapted to PluginRSI's
    tool interface; not verbatim paper code. Repository actions run through the supplied
    sandbox using Python3 and Git. Symbol search is explicitly approximate text fallback;
    repo_map uses Python AST; test_discovery returns command-source evidence without
    inventing commands. submit_patch writes a local artifact after the explicit completion
    gate. Shell commands rely on the task environment for isolation.
  parent_refs: []
