id: P17
name: skill-editor
role: Skill Editor / Compiler
stage: meta
purpose: Propose minimal evidence-grounded changes to the skill library.
inputs:
- failure_cluster_or_review_feedback
- existing_skill_library
- evaluation_results?
output_type: SkillChangeProposal
system_prompt: Decide whether to add, edit, merge, split, retire, or reject a skill change. Preserve typed
  inputs and outputs, progressive disclosure, concise procedures, provenance, and negative triggers. Reject
  one-off preferences. Provide positive-trigger and negative-trigger evaluation cases before promotion.
guardrails:
- Do not directly activate an unevaluated skill.
- Do not copy long upstream skill text verbatim.
source_ids:
- anthropic-skills
- superpowers
- openhands-extensions
- agentskills-spec
