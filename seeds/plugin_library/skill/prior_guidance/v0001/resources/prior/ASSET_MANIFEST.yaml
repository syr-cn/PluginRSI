representation_policy:
  canonical_data: YAML
  modular_prompts: One YAML file per prompt; no aggregate JSON or CSV copies.
  modular_skills: One standard SKILL.md per skill plus a metadata-only YAML catalog.
  workflows: One YAML file per workflow; no aggregate JSON or CSV copies.
  json_exception: JSON is retained only for JSON Schema documents.

provenance:
  status: These are normalized, synthesized abstractions rather than verbatim upstream instructions.
  source_ids: Each asset retains source identifiers for traceability.
  full_backup: ../backups/MetaDSH_modular_harness_assets_v1_original/modular_harness_assets_v1
  caveat: Structural validation does not establish empirical performance; promotion still requires matched-budget evaluation.
