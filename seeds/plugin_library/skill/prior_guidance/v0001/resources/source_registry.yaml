- id: deepseek-harness
  name: DeepSeek Harness
  kind: target_runtime
  url: https://github.com/deepseek-ai/deepseek-harness
  ref: master
  priority: P0
  license: MIT; verify at fetched commit
  fetch_default: true
  large: true
  modules:
  - Prompt / Experience
  - Harness Scaffold
  - Skill / Tools
  take:
  - plugin boundaries and scoped service registries
  - ordered system-prompt assembly and tool-schema injection
  - filesystem-backed skill provider and workflow orchestration seams
  - context, session, compaction, storage and invariant interfaces
  avoid:
  - coupling the paper claim to one developer-preview API
  - opening prompt, graph, skill and memory mutation simultaneously
  relevant_paths:
  - packages/core/system-prompt/
  - packages/core/tools/
  - packages/skill/
  - packages/workflow/
  - packages/context/
  - packages/session/
  - packages/compaction/
  - docs/
  - AGENTS.md
